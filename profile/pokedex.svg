<svg width="480" height="600" viewBox="0 0 480 600" fill="none" xmlns="http://www.w3.org/2000/svg">
<style>
.title { font: 600 18px 'Segoe UI', Ubuntu, Sans-Serif; fill: #2f80ed }
.name { font: 600 22px 'Segoe UI', Ubuntu, Sans-Serif; fill: #434d58 }
.handle { font: 500 13px 'Segoe UI', Ubuntu, Sans-Serif; fill: #858585 }
.cp { font: 700 14px 'Segoe UI', Ubuntu, Sans-Serif; fill: #ffffff }
.statlabel { font: 600 11px 'Segoe UI', Ubuntu, Sans-Serif; fill: #858585; letter-spacing: 1px }
.statval { font: 700 16px 'Segoe UI', Ubuntu, Sans-Serif; fill: #434d58 }
.statlabel2 { font: 600 12px 'Segoe UI', Ubuntu, Sans-Serif; fill: #858585; letter-spacing: 1px }
.statval2 { font: 700 14px 'Segoe UI', Ubuntu, Sans-Serif; fill: #434d58 }
.lang { font: 600 12px 'Segoe UI', Ubuntu, Sans-Serif; fill: #434d58 }
.pct { font: 600 12px 'Segoe UI', Ubuntu, Sans-Serif; fill: #858585 }
.fallback-initial { font: 700 30px 'Segoe UI', Ubuntu, Sans-Serif; fill: #ffffff }
</style>
<defs>
<clipPath id="avclip"><circle cx="122" cy="140" r="34"/></clipPath>
</defs>
<rect x="0.5" y="0.5" width="479" height="599" rx="4.5" fill="#fffefe" stroke="#e4e2e2"/>
<text x="25" y="35" class="title">Pokédex</text>

<!-- Trainer card (slides up out of the ball) -->
<g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.36;0.44;0.86;0.92;1" dur="8s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0 140;0 140;0 -8;0 0;0 0;0 140" keyTimes="0;0.36;0.46;0.5;0.88;0.95" dur="8s" repeatCount="indefinite"/>
    <rect x="70.5" y="70.5" width="335" height="139" rx="11" fill="#ffffff" stroke="#e4e2e2"/>
    <circle cx="122" cy="140" r="38" fill="#ffffff" stroke="#e4e2e2" stroke-width="2"/>
<image href="data:image/png;base64," x="88" y="106" width="68" height="68" clip-path="url(#avclip)" preserveAspectRatio="xMidYMid slice"/>
    <text x="178" y="126" class="name">Duong</text>
    <text x="178" y="148" class="handle">@duongoku</text>
    <rect x="178" y="158" width="104" height="26" rx="13" fill="#2f80ed"/>
    <text x="230" y="176" text-anchor="middle" class="cp">CP ★ 66</text>
    <text x="290" y="112" class="statlabel">REPOS</text>
    <text x="392" y="112" text-anchor="end" class="statval">68</text>
    <text x="290" y="140" class="statlabel">FOLLOWERS</text>
    <text x="392" y="140" text-anchor="end" class="statval">33</text>
    <text x="290" y="168" class="statlabel">FORKS</text>
    <text x="392" y="168" text-anchor="end" class="statval">7</text>
</g>

<!-- Sparkles on reveal -->
<g fill="#2f80ed">
    <rect x="292" y="212" width="9" height="9" transform="rotate(45 296.5 216.5)" opacity="0">
        <animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.36;0.42;0.55;1" dur="8s" repeatCount="indefinite"/>
    </rect>
    <rect x="176" y="222" width="7" height="7" transform="rotate(45 179.5 225.5)" opacity="0">
        <animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.38;0.44;0.57;1" dur="8s" repeatCount="indefinite"/>
    </rect>
    <rect x="306" y="286" width="8" height="8" transform="rotate(45 310 290)" opacity="0">
        <animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.40;0.46;0.59;1" dur="8s" repeatCount="indefinite"/>
    </rect>
</g>

<!-- Reveal flash -->
<circle cx="240" cy="264" r="0" fill="#ffffff">
    <animate attributeName="r" values="0;0;64;64" keyTimes="0;0.31;0.40;1" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0;0.85;0;0" keyTimes="0;0.31;0.35;0.42;1" dur="8s" repeatCount="indefinite"/>
</circle>

<!-- Pokéball -->
<g>
    <animateTransform attributeName="transform" type="rotate" values="0 240 264;-16 240 264;14 240 264;-12 240 264;10 240 264;-4 240 264;0 240 264;0 240 264" keyTimes="0;0.05;0.10;0.15;0.20;0.26;0.30;1" dur="8s" repeatCount="indefinite"/>
    <ellipse cx="240" cy="322" rx="42" ry="6" fill="#434d58" opacity="0.08"/>
    <!-- top half (flips open on hinge at left edge) -->
    <g>
        <animateTransform attributeName="transform" type="rotate" values="0 192 264;0 192 264;-135 192 264;-135 192 264;0 192 264" keyTimes="0;0.30;0.36;0.92;1" dur="8s" repeatCount="indefinite"/>
        <path d="M 192 264 A 48 48 0 0 1 288 264 Z" fill="#ffffff" stroke="#e4e2e2" stroke-width="1"/>
        <path d="M 196 236 A 48 48 0 0 1 284 236 L 276 251 A 30 30 0 0 0 204 251 Z" fill="#434d58" opacity="0.06"/>
        <rect x="192" y="258" width="96" height="7" fill="#32363b"/>
    </g>
    <!-- bottom half (drops slightly) -->
    <g>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 0;0 16;0 16;0 0" keyTimes="0;0.30;0.36;0.92;1" dur="8s" repeatCount="indefinite"/>
        <path d="M 192 264 A 48 48 0 0 0 288 264 Z" fill="#ffffff" stroke="#e4e2e2" stroke-width="1"/>
        <rect x="192" y="264" width="96" height="7" fill="#32363b"/>
        <circle cx="240" cy="264" r="13" fill="#ee4035"/>
        <circle cx="240" cy="264" r="8" fill="#ffffff" stroke="#ee4035" stroke-width="3"/>
    </g>
</g>

<!-- GitHub Stats (static 2x2 grid) -->
<text x="25" y="352" class="title">GitHub Stats</text>
  <text x="25" y="376" class="statlabel2">Public Repos</text>
  <text x="230" y="376" text-anchor="end" class="statval2">68</text>
  <text x="250" y="376" class="statlabel2">Total Stars</text>
  <text x="455" y="376" text-anchor="end" class="statval2">66</text>
  <text x="25" y="396" class="statlabel2">Total Forks</text>
  <text x="230" y="396" text-anchor="end" class="statval2">7</text>
  <text x="250" y="396" class="statlabel2">Followers</text>
  <text x="455" y="396" text-anchor="end" class="statval2">33</text>
  <text x="25" y="428" class="title">Top Languages</text>
  <text x="25" y="452" class="lang">HTML</text>
  <rect x="25" y="460" width="430" height="8" rx="4" fill="#e4e2e2"/>
  <rect x="25" y="460" width="128" height="8" rx="4" fill="#2f80ed"/>
  <text x="455" y="452" text-anchor="end" class="pct">29.8%</text>
  <text x="25" y="482" class="lang">Python</text>
  <rect x="25" y="490" width="430" height="8" rx="4" fill="#e4e2e2"/>
  <rect x="25" y="490" width="66" height="8" rx="4" fill="#2f80ed"/>
  <text x="455" y="482" text-anchor="end" class="pct">15.5%</text>
  <text x="25" y="512" class="lang">JavaScript</text>
  <rect x="25" y="520" width="430" height="8" rx="4" fill="#e4e2e2"/>
  <rect x="25" y="520" width="62" height="8" rx="4" fill="#2f80ed"/>
  <text x="455" y="512" text-anchor="end" class="pct">14.5%</text>
  <text x="25" y="542" class="lang">TypeScript</text>
  <rect x="25" y="550" width="430" height="8" rx="4" fill="#e4e2e2"/>
  <rect x="25" y="550" width="54" height="8" rx="4" fill="#2f80ed"/>
  <text x="455" y="542" text-anchor="end" class="pct">12.7%</text>
  <text x="25" y="572" class="lang">Dart</text>
  <rect x="25" y="580" width="430" height="8" rx="4" fill="#e4e2e2"/>
  <rect x="25" y="580" width="28" height="8" rx="4" fill="#2f80ed"/>
  <text x="455" y="572" text-anchor="end" class="pct">6.6%</text>
</svg>
